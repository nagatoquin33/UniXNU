name: sheng metal addon

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sheng-metal-addon.yml
      - scripts/ci-metal-addon.sh

jobs:
  addon:
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: true

      - name: Check out the offline inputs
        uses: actions/checkout@v4
        with:
          ref: ci-inputs
          path: ci-inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unpack the offline inputs
        run: |
          set -euxo pipefail
          mkdir -p .cache/gpu-reference
          cat ci-inputs/mesa-work.tar.gz.part-* > mesa-work.tar.gz
          tar -xzf mesa-work.tar.gz -C .cache
          cat ci-inputs/metal2vulkan.tar.gz.part-* > metal2vulkan.tar.gz
          tar -xzf metal2vulkan.tar.gz -C .cache/gpu-reference
          git -C .cache/gpu-reference/metal2vulkan checkout -- .
          git -C .cache/mesa-work rev-parse HEAD
          git -C .cache/gpu-reference/metal2vulkan rev-parse HEAD

      - name: Build the add-on
        run: bash scripts/ci-metal-addon.sh

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-metal-addon-logs
          path: ci-metal-addon.log
          if-no-files-found: warn

      - name: Report the failure
        if: failure()
        run: |
          tail -40 ci-metal-addon.log | while IFS= read -r line; do echo "::error::$line"; done

      - name: Publish the failure log
        if: failure()
        run: |
          set -x
          cp ci-metal-addon.log failure.log
          git config user.name "ci"
          git config user.email "ci@invalid"
          git checkout -B ci-failure-log
          git add -f failure.log
          git commit -m "CI failure log for $GITHUB_SHA"
          git push -f origin ci-failure-log

      - name: Stage the plugin into the Data seed
        if: success()
        run: |
          set -euxo pipefail
          python3 scripts/add-gpu-plugin-data.py --publish --clients "*" ci-inputs/sheng-data-32m.dbr build/sheng-data-with-gpu.dbr
          ls -la build/sheng-data-with-gpu.dbr

      - name: Upload the staged seed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-data-with-gpu
          path: build/sheng-data-with-gpu.dbr

      - name: Upload the add-on
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sheng-metal-addon
          path: build/adreno-metal-plugin/
          if-no-files-found: error
