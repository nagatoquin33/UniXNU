name: sheng data grow

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sheng-data-grow.yml

jobs:
  grow:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the offline inputs
        uses: actions/checkout@v4
        with:
          ref: ci-inputs
          path: ci-inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Grow the Data seed to 960 GiB
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 drivers/DarwinBoot
          mkdir -p build
          python3 scripts/seed-data-grow.py --gib 960 ci-inputs/sheng-data-32m.dbr build/sheng-data-960g.dbr
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0,'drivers/DarwinBoot/Test'); import packed_ramdisk; p=Path('build/sheng-data-960g.dbr'); i, header=packed_ramdisk.inspect(p); print('Seed report:', i); print('Packed bytes:', p.stat().st_size); assert i['bytes']==960*1024**3, i; assert header[32:36]==b'NXSB', 'Not an APFS container'; assert p.stat().st_size<=256*1024**2, p.stat().st_size"
          ls -lh build/sheng-data-960g.dbr
          df -h .

      - name: Upload the seed
        uses: actions/upload-artifact@v4
        with:
          name: sheng-data-960g
          path: build/sheng-data-960g.dbr
          if-no-files-found: error
